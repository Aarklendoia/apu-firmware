name: Firmware

# Checks every week whether 3mdeb has published a new Dasharo version for PC Engines, for
# each variant (SeaBIOS and UEFI by default, repository variable APU_VARIANTS).
# If no release with that name exists here, builds the ROMs and publishes a release.

on:
  schedule:
    - cron: '23 4 * * 1'          # Monday 04:23 UTC
  workflow_dispatch:
    inputs:
      variant:
        description: Variant
        type: choice
        options: [seabios, uefi]
        default: seabios
      version:
        description: Exact version (empty = latest)
        required: false
        default: ''
      unreleased:
        description: Include unreleased rel_* branches (prerelease)
        type: boolean
        default: false
      force:
        description: Rebuild even if the release exists
        type: boolean
        default: false
      patch_tool:
        description: How to apply the Dasharo patch queue (SeaBIOS)
        type: choice
        options: [am, guilt]
        default: am
      mirrors:
        description: Where submodules and payloads come from
        type: choice
        options: [github, upstream]
        default: github
      publish:
        description: Publish a release (off = test build, ROM kept as a workflow artifact)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.v.outputs.releases }}
      builds: ${{ steps.v.outputs.builds }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          # scheduled runs build every variant of the repository variable APU_VARIANTS
          VARIANTS: ${{ inputs.variant && format('["{0}"]', inputs.variant) || vars.APU_VARIANTS || '["seabios","uefi"]' }}
          BOARDS: ${{ vars.APU_BOARDS || '["apu4"]' }}
          UNRELEASED: ${{ inputs.unreleased && '1' || '0' }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          # scheduled runs have no inputs: they always publish
          PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && !inputs.publish) && 'false' || 'true' }}
        run: |
          releases='[]'
          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            ver=${VERSION:-$(VARIANT=$variant scripts/apu-fw latest)}
            [ -n "$ver" ] || { echo "::error::no $variant version found"; exit 1; }
            base=${ver%-unreleased}
            tag="$variant-v$base"; pre=false
            if [ "$ver" != "$base" ]; then tag="$tag-unreleased"; pre=true; fi

            if [ "$PUBLISH" = false ]; then
              echo "::notice::test build of $tag, nothing will be published"
            elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
              echo "::notice::$tag already released, nothing to do"
              continue
            else
              echo "::notice::building $tag"
            fi
            releases=$(jq -c --arg variant "$variant" --arg version "$ver" --arg tag "$tag" --argjson pre "$pre" \
              '. + [{variant: $variant, version: $version, tag: $tag, prerelease: $pre}]' <<<"$releases")
          done
          {
            echo "releases=$releases"
            echo "builds=$(jq -c --argjson boards "$BOARDS" '[.[] as $r | $boards[] | $r + {board: .}]' <<<"$releases")"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # one entry per variant and board (repository variable APU_BOARDS, e.g. ["apu2","apu4"])
        include: ${{ fromJSON(needs.check.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install guilt
        if: inputs.patch_tool == 'guilt'
        run: sudo apt-get install -y -qq guilt >/dev/null

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.variant }}
          PATCH_TOOL: ${{ inputs.patch_tool || 'am' }}
          MIRRORS: ${{ inputs.mirrors || 'github' }}
          WORKDIR: ${{ runner.temp }}/apu-fw
          OUTDIR: ${{ runner.temp }}/out
        run: scripts/apu-fw build "${{ matrix.version }}"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.variant }} ${{ matrix.board }}"
            echo '```'
            cat "${{ runner.temp }}"/out/*.sha256
            grep -h '^official\|^patched' "${{ runner.temp }}"/out/*.sources
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: rom-${{ matrix.variant }}-${{ matrix.board }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true' && needs.check.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rom-${{ matrix.variant }}-*
          path: out
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
          PRERELEASE: ${{ matrix.prerelease }}
        working-directory: out
        run: |
          sha256sum *.rom > SHA256SUMS
          {
            echo "Dasharo ($VARIANT) v$VERSION for PC Engines, built from 3mdeb's public sources."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "### Official 3mdeb build"
            echo
            echo "3mdeb builds are reproducible: a ROM identical to theirs is bit for bit the official firmware."
            echo
            for f in *.sources; do echo "- $(sed -n 's/^official *//p' "$f")"; done
            echo
            echo "### Sources"
            for f in *.sources; do echo; echo '```'; cat "$f"; echo '```'; done
            if [ "$PRERELEASE" = true ]; then
              echo
              echo "> Release branch not yet published by 3mdeb: not validated, for testing only."
            fi
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.rom *.sha256 *.sources SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            flags=""
            [ "$PRERELEASE" = true ] && flags="--prerelease"
            gh release create "$TAG" *.rom *.sha256 *.sources SHA256SUMS $flags \
              --title "Dasharo $VARIANT v$VERSION" --notes-file notes.md \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
