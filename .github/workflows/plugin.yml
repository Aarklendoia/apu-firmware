name: Plugin

# Lint, tests and package on every PR: lint-test and package are required checks for
# merging, so they must run whatever files changed.
# On main, if the plugin changed since the last plugin-v* release, publish a new
# version X.Y.Z: X.Y comes from the plugin Makefile, Z is incremented.

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP syntax
        run: find plugin -name '*.php' -o -name '*.inc' | xargs -n1 php -l

      - name: XML
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          find plugin -name '*.xml' -print0 | xargs -0 xmllint --noout

      - name: Shell
        run: shellcheck --severity=warning scripts/apu-fw plugin/install.sh

      - name: Python
        run: pipx run flake8 --max-line-length=120 plugin

      - name: Backend tests
        run: python3 -I plugin/tests/test_apufw.py plugin/sysutils/apufirmware/src/opnsense/scripts/OPNsense/ApuFirmware/apufw.py

  package:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: plugin-package-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # tags and history for the version and the notes

      - id: v
        run: |
          base=$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' plugin/sysutils/apufirmware/Makefile)
          [ -n "$base" ] || { echo "::error::PLUGIN_VERSION not found"; exit 1; }
          prev=$(git tag -l 'plugin-v*' --sort=-v:refname | head -1)
          last=$(git tag -l "plugin-v$base.*" --sort=-v:refname | head -1)
          if [ -n "$last" ]; then patch=$(( ${last##*.} + 1 )); else patch=0; fi
          version=$base.$patch

          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- plugin/sysutils; then
              release=true
            else
              echo "::notice::plugin unchanged since $prev, no new version"
            fi
          fi
          echo "::notice::version $version (release: $release)"
          {
            echo "version=$version"
            echo "prev=$prev"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Build (FreeBSD)
        uses: vmactions/freebsd-vm@v1
        env:
          VERSION: ${{ steps.v.outputs.version }}
          HASH: ${{ github.sha }}
        with:
          release: '14.3'
          envs: 'VERSION HASH'
          prepare: env ASSUME_ALWAYS_YES=yes pkg install git flashrom
          run: |
            set -e
            git clone -q --depth 1 https://github.com/opnsense/plugins /tmp/plugins
            cp -R plugin/sysutils/apufirmware /tmp/plugins/sysutils/
            # empty PLUGIN_DEVEL: otherwise the opnsense/plugins master branch builds os-apufirmware-devel
            make -C /tmp/plugins/sysutils/apufirmware package PLUGIN_DEVEL= \
              PLUGIN_VERSION="$VERSION" PLUGIN_HASH="$(echo "$HASH" | cut -c1-10)" PKGDIR="$PWD/dist"
            pkg info -F dist/*.pkg
            [ "$(pkg query -F dist/*.pkg %n)" = os-apufirmware ] || { echo 'unexpected package name'; exit 1; }
            pkg query -F dist/*.pkg 'abi: %q' | grep -qi 'freebsd:\*:\*' || { echo 'package is tied to an ABI'; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: os-apufirmware-${{ steps.v.outputs.version }}
          path: dist/*.pkg
          if-no-files-found: error

      - name: Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PREV: ${{ steps.v.outputs.prev }}
        run: |
          {
            echo "OPNsense plugin os-apufirmware $VERSION."
            echo
            echo "Install or update, as root on the router:"
            echo
            echo '```sh'
            echo "fetch -o - https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/plugin/install.sh | sh"
            echo '```'
            echo
            echo "### Changes"
            echo
            git log --no-merges --format='- %s' ${PREV:+"$PREV"..}HEAD -- plugin/sysutils
          } > notes.md
          gh release create "plugin-v$VERSION" dist/*.pkg \
            --title "Plugin os-apufirmware $VERSION" --notes-file notes.md \
            --target "$GITHUB_SHA" --latest=false --repo "$GITHUB_REPOSITORY"
